<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scientific Notation Checker</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        font-family: Arial, sans-serif;
        color: white;
    }

    .card {
        background: #1e1e2f;
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        width: 350px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        animation: fadeIn 1s ease;
    }

    h2 {
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: none;
        outline: none;
        margin-bottom: 20px;
        font-size: 16px;
    }

    button {
        background: #e74c3c;
        border: none;
        padding: 10px 25px;
        color: white;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #c0392b;
        transform: scale(1.05);
    }

    #result {
        margin-top: 20px;
        font-weight: bold;
        opacity: 0;
        transition: 0.5s;
    }

    .show {
        opacity: 1 !important;
    }

    .yes {
        color: #2ecc71;
    }

    .no {
        color: #e74c3c;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px);}
        to { opacity: 1; transform: translateY(0);}
    }
</style>
</head>

<body>

<div class="card">
    <h2>Scientific Notation Checker</h2>

    <input type="text" id="input" placeholder="Contoh: 2x10^3">

    <br>
    <button onclick="check()">Run</button>

    <div id="result"></div>
</div>

<script>
function check() {
    let value = document.getElementById("input").value;

    // regex cek notasi ilmiah
    let regex = /^[+-]?\d+(\.\d+)?x10\^[+-]?\d+$/i;

    let result = document.getElementById("result");

    if(regex.test(value)) {
        result.innerHTML = "Result = Yes, it is a scientific number ✓";
        result.className = "yes show";
    } else {
        result.innerHTML = "Result = No, not a scientific number ✗";
        result.className = "no show";
    }
}
</script>

</body>
</html>
